services:
  postman2api:
    build: .
    ports:
      - "${PORT:-1930}:${PORT:-1930}"
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-1930}
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY in .env}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      DATABASE_PATH: /app/data/postman2api.db
      REQUIRE_PERSISTENT_STORAGE: "false"
      ENABLE_BROWSER_LOGIN: ${ENABLE_BROWSER_LOGIN:-false}
      CAMOUFOX_HEADLESS: ${CAMOUFOX_HEADLESS:-true}
      PROXY_BOOTSTRAP: ${PROXY_BOOTSTRAP:-}
      PROXY_TEST_URL: ${PROXY_TEST_URL:-https://api.ipify.org?format=json}
    restart: unless-stopped
